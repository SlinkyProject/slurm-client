---
version: '2'
run:
  tests: true
linters:
  enable:
    - asasalint
    - errcheck
    - errorlint
    - gocritic
    - gosec
    - ineffassign
    - misspell
    - nilnil
    - nilerr
    - unused
    - wastedassign
  settings:
    misspell:
      locale: US
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
